# MRL Unified Gateway — Nginx Reverse Proxy
# origin_signature: MrLiouWord
# 怎麼過去就怎麼回來

worker_processes auto;
events { worker_connections 4096; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain text/html text/css application/javascript;

    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    upstream engine   { server mrl-engine:7700;  keepalive 32; }
    upstream product  { server mrl-product:3000; keepalive 16; }
    upstream ai       { server mrl-ai:8787;      keepalive 16; }
    upstream ai800    { server mrl-800ai:8787;   keepalive 8;  }

    server {
        listen 80;
        server_name mrliouword.com *.mrliouword.com localhost;

        add_header X-Origin-Signature "MrLiouWord" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Product platform (default frontend)
        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://product;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Engine core (particle workers)
        location /engine/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://engine/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_read_timeout 30s;
            proxy_buffering off;
        }

        # AI SuperComputer endpoints
        location /ai/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ai/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # 800AI Orchestrator (agent dispatch, physics audit)
        location /800ai/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ai800/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # Health aggregator
        location = /health {
            proxy_pass http://engine/health;
            proxy_http_version 1.1;
            access_log off;
        }
    }
}
