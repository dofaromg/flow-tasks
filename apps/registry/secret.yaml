apiVersion: v1
kind: Secret
metadata:
  name: registry-secret
  namespace: flowagent
  labels:
    app: registry
type: Opaque
stringData:
  # HTTP secret for registry - CHANGE THIS IN PRODUCTION
  http-secret: "flowagent-registry-secret-key-2026"
