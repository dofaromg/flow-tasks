  #   htpasswd -Bbn admin '<your-strong-password>'
  # ⚠️ CRITICAL: Do NOT use this example in production. Always override via a secure Secret.
  htpasswd: |
    admin:$2y$05$V9iUjE3xZl8pL5qfC7rOeu6bR1nQ0sM8dWYh2A9kT3cX5vB6N4PiK
