# MRL_Product_v1 Nginx 設定
# origin_signature: MrLiouWord
# target: DL580 G9 自有部署  v1.2
#
# HTTPS 啟用步驟（取得 SSL 憑證後）：
#   1. 把憑證放到 /opt/mrl_product_v1/ssl/
#   2. 取消 HTTPS server block 的註解
#   3. 在 HTTP server block 改為 return 301 https://...
#   4. docker compose restart nginx

upstream mrl_app {
    server app:3000;
    keepalive 32;
}

# ── HTTP server ───────────────────────────────────────────────────
server {
    listen 80;
    server_name _;          # 改成你的 domain，例如 mrl.yourdomain.com

    # HTTPS 啟用後，取消下面這行，把後面的 location 塊全部刪掉
    # return 301 https://$host$request_uri;

    # ── 通用 proxy 設定 ─────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ── Stripe Webhook（raw body，不加任何處理）──────────
    location /webhook/stripe {
        proxy_pass         http://mrl_app;
        proxy_read_timeout 30s;
        # 注意：不能加 proxy_buffering off 以外的 body 處理
        client_max_body_size 512k;
    }

    # ── API 路由 ─────────────────────────────────────────
    location /api/ {
        proxy_pass http://mrl_app;
    }

    # ── Admin（只允許本機或限定 IP，正式環境可加 allow/deny）
    location /admin/ {
        proxy_pass http://mrl_app;
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny  all;
    }

    # ── 靜態資源快取 ─────────────────────────────────────
    location /assets/ {
        proxy_pass http://mrl_app;
        expires    1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    # ── 健康檢查（不寫 log）───────────────────────────────
    location /health {
        proxy_pass http://mrl_app;
        access_log off;
    }

    # ── 所有其他請求 ─────────────────────────────────────
    location / {
        proxy_pass http://mrl_app;
    }

    # ── 全域設定 ─────────────────────────────────────────
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript
        application/x-javascript text/xml application/xml;

    # Log
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

