name: MRL Terminal Authorization Regression
# origin_signature: MrLiouWord

on:
  pull_request:
    paths:
      - 'MRL_Mother/04_runtime/flowcore_loop.py'
      - 'tests/test_Mrliou_terminal_authorization.py'
      - '.github/workflows/Mrliou_Terminal_Authorization.yml'
  push:
    branches: [main]
    paths:
      - 'MRL_Mother/04_runtime/flowcore_loop.py'
      - 'tests/test_Mrliou_terminal_authorization.py'
      - '.github/workflows/Mrliou_Terminal_Authorization.yml'

permissions:
  contents: read

jobs:
  terminal-authorization-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest requests
      - run: python -m pytest -q -o addopts='' tests/test_Mrliou_terminal_authorization.py
