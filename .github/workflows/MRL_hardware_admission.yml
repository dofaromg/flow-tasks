name: MRL hardware admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/mrl_hardware_admission.py'
      - 'utils/gpu_orchestrator.py'
      - 'configs/MRL_hardware*'
      - 'configs/MRL_hardware_evidence/**'
      - 'tests/test_mrl_hardware_admission.py'
      - '.github/workflows/MRL_hardware_admission.yml'
  push:
    branches: [main, MRL_mrl34_hardware_admission_v1]
    paths:
      - 'utils/mrl_hardware_admission.py'
      - 'utils/gpu_orchestrator.py'
      - 'configs/MRL_hardware*'
      - 'configs/MRL_hardware_evidence/**'
      - 'tests/test_mrl_hardware_admission.py'
      - '.github/workflows/MRL_hardware_admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Package exact-head gate sources without Windows-invalid legacy paths
        run: |
          python -c "import pathlib,zipfile; roots=['utils','configs']; files=[p for root in roots for p in pathlib.Path(root).rglob('*') if p.is_file() and '__pycache__' not in p.parts]; files.append(pathlib.Path('tests/test_mrl_hardware_admission.py')); z=zipfile.ZipFile('MRL_gate_sources.zip','w'); [z.write(p,p.as_posix()) for p in files]; z.close()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MRL-gate-sources
          path: MRL_gate_sources.zip
          if-no-files-found: error
          retention-days: 7
  policy:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: MRL-gate-sources
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Extract gate sources from this workflow run
        run: python -m zipfile -e MRL_gate_sources.zip .
      - name: Compile hardware modules
        run: python -m py_compile utils/mrl_hardware_admission.py utils/gpu_orchestrator.py
      - name: Hardware admission policy regressions (synthetic, no hardware claim)
        run: python -m unittest discover -s tests -p test_mrl_hardware_admission.py -v
      - name: Validate owner-reviewed hardware registry
        run: python -m utils.mrl_hardware_admission --validate-matrix
