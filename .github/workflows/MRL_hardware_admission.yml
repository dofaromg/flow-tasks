name: MRL hardware admission
on:
  pull_request:
    branches: [main]
    paths:
      - 'utils/mrl_hardware_admission.py'
      - 'utils/gpu_orchestrator.py'
      - 'configs/MRL_hardware*'
      - 'configs/MRL_hardware_evidence/**'
      - 'tests/test_mrl_hardware_admission.py'
      - '.github/workflows/MRL_hardware_admission.yml'
  push:
    branches: [main, MRL_mrl34_hardware_admission_v1]
    paths:
      - 'utils/mrl_hardware_admission.py'
      - 'utils/gpu_orchestrator.py'
      - 'configs/MRL_hardware*'
      - 'configs/MRL_hardware_evidence/**'
      - 'tests/test_mrl_hardware_admission.py'
      - '.github/workflows/MRL_hardware_admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile hardware modules
        run: python -m py_compile utils/mrl_hardware_admission.py utils/gpu_orchestrator.py
      - name: Hardware admission policy regressions (synthetic, no hardware claim)
        run: python -m unittest discover -s tests -p test_mrl_hardware_admission.py -v
      - name: Validate owner-reviewed hardware registry
        run: python -m utils.mrl_hardware_admission --validate-matrix
