name: MRL Governance Tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  governance-tests:
    name: governance-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest pyyaml
      - run: python scripts/validate_mrl_governance.py --ref HEAD
      - run: python -m pytest -q MRL_Mother/tests_mrl_ai_system/test_MRL_governance_contracts.py MRL_Mother/tests_mrl_ai_system/test_MRL_flowagent_lawengine.py MRL_Mother/tests_mrl_ai_system/test_MRL_origin_boundary_guard.py MRL_Mother/tests_mrl_ai_system/test_MRL_canonical_projection.py
