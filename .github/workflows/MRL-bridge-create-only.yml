name: MRL Bridge create_only
on:
  pull_request:
    paths: ['MRL_Bridge/**', 'scripts/MRL_verify_bridge_backfill_v1.py', 'connectors/test_bridge_backfill.py', '.github/workflows/MRL-bridge-create-only.yml']
  push:
    branches: ['MRL_fix/bridge-atomic-create-only-20261101']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os != 'Windows'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /MRL_Bridge/
            /connectors/
            /scripts/MRL_verify_bridge_backfill_v1.py
            /pytest.ini
      - name: Materialize only portable dependency paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MRL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Bare fetch avoids indexing unrelated Windows-invalid historical names.
          git init --bare .git
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git --git-dir=.git fetch "https://github.com/$env:GITHUB_REPOSITORY.git" $env:MRL_HEAD_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $paths = git --git-dir=.git ls-tree -r --name-only FETCH_HEAD -- MRL_Bridge connectors scripts/MRL_verify_bridge_backfill_v1.py pytest.ini
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($file in $paths) {
            $parent = Split-Path $file -Parent
            if ($parent) { New-Item -ItemType Directory -Force -Path $parent | Out-Null }
            $psi = [Diagnostics.ProcessStartInfo]::new('git')
            $psi.ArgumentList.Add('--git-dir=.git')
            $psi.ArgumentList.Add('cat-file')
            $psi.ArgumentList.Add('blob')
            $psi.ArgumentList.Add("$($env:MRL_HEAD_SHA):$file")
            $psi.RedirectStandardOutput = $true
            $proc = [Diagnostics.Process]::Start($psi)
            $stream = [IO.File]::Create((Join-Path $pwd $file))
            try { $proc.StandardOutput.BaseStream.CopyTo($stream) } finally { $stream.Dispose() }
            $proc.WaitForExit()
            if ($proc.ExitCode) { exit $proc.ExitCode }
          }
          git --git-dir=.git config core.bare false
          git --git-dir=.git update-ref HEAD $env:MRL_HEAD_SHA
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test MRL_Bridge/mrl_create_only.test.cjs
      - run: node --check MRL_Bridge/server.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest requests pyyaml
      - run: python -m pytest connectors/test_bridge_backfill.py -q
