name: CD - Deploy MrLiou App

on:
  workflow_run:
    workflows: ["CI - Build MrLiou App Container Images"]
    types:
      - completed
    branches: [ "main" ]
  workflow_dispatch:

env:
  PROJECT_ID: mrliou
  REGISTRY: localhost:5000

jobs:
  deploy:
    if: false
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via docker-compose
      run: |
        docker compose -f docker-compose.unified.yml pull
        docker compose -f docker-compose.unified.yml up -d --build

    - name: Health check
      run: |
        sleep 10
        for port in 7700 3000 8787 8800 7800 8790 8788 80; do
          echo "Checking port $port..."
          curl -sf http://localhost:$port/health || echo "Port $port not ready"
        done

    - name: Summary
      run: |
        echo "### MrLiou App Deployment Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Services:**" >> $GITHUB_STEP_SUMMARY
        docker compose -f docker-compose.unified.yml ps >> $GITHUB_STEP_SUMMARY
