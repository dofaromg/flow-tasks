name: Mrliou MRL Cloudflare Package
on:
  pull_request:
    paths:
      - 'package*.json'
      - 'wrangler.jsonc'
      - 'open-next.config.ts'
      - 'next.config.mjs'
      - 'pages/**'
      - 'lib/**'
      - '.github/workflows/Mrliou_MRL_Cloudflare_Package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check:cloudflare
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          WRANGLER_SEND_METRICS: 'false'
