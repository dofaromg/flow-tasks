name: MRL Tailnet Receipt Tests

on:
  pull_request:
    paths:
      - 'MRL_Mother/deploy_reference/tailscale/**'
      - '.github/workflows/mrl-tailnet-receipt-tests.yml'

permissions:
  contents: read

jobs:
  synthetic-receipts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: MRL_Mother/deploy_reference/tailscale
    steps:
      - name: Retrieve test inputs at the exact PR head
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const prefix = 'MRL_Mother/deploy_reference/tailscale/';
            const ref = context.payload.pull_request.head.sha;
            fs.mkdirSync(prefix, {recursive: true});
            for (const name of [
              'MRL_tailnet_cross_device_receipt_v1.py',
              'test_MRL_tailnet_cross_device_receipt_v1.py',
              'MRL_tailnet_bridge_receipt_v1.ps1'
            ]) {
              const {data} = await github.rest.repos.getContent({
                ...context.repo, path: prefix + name, ref
              });
              if (data.type !== 'file' || data.encoding !== 'base64') {
                throw new Error('Unexpected test input: ' + name);
              }
              const bytes = Buffer.from(data.content, 'base64');
              if (!bytes.length || bytes.length !== data.size) {
                throw new Error('Invalid test input size: ' + name);
              }
              fs.writeFileSync(prefix + name, bytes);
            }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test synthetic network and receipt cases
        run: python -m unittest -v test_MRL_tailnet_cross_device_receipt_v1
      - name: Parse original collector on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = $null
          $tokens = $null
          $path = (Resolve-Path .\MRL_tailnet_bridge_receipt_v1.ps1).Path
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors) { $parseErrors | Out-String | Write-Error; exit 1 }
