name: MRL Financial Core
on:
  pull_request:
    paths:
      - 'MRL_Mother/MRL_Extensions/MRL_Financial_Core_v1/**'
      - 'MRL_Mother/09_workflow/tool_registry.py'
      - '.github/workflows/mrl-financial-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /MRL_Mother/MRL_Extensions/MRL_Financial_Core_v1/
            /MRL_Mother/09_workflow/tool_registry.py
      - uses: actions/upload-artifact@v4
        with:
          name: mrl-financial-test-source
          path: MRL_Mother/
          if-no-files-found: error
          retention-days: 7
  sandbox-invariants:
    needs: source-bundle
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows Git rejects legacy names even outside sparse paths. Transfer only
      # the exact source files, rather than disabling Windows path protections.
      - uses: actions/download-artifact@v4
        with:
          name: mrl-financial-test-source
          path: MRL_Mother
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r MRL_Mother/MRL_Extensions/MRL_Financial_Core_v1/requirements.txt
      - run: python -m unittest MRL_Mother.MRL_Extensions.MRL_Financial_Core_v1.test_core -v
