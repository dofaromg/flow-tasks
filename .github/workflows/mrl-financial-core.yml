name: MRL Financial Core
on:
  pull_request:
    paths:
      - 'MRL_Mother/MRL_Extensions/MRL_Financial_Core_v1/**'
      - 'MRL_Mother/09_workflow/tool_registry.py'
      - '.github/workflows/mrl-financial-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox-invariants:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /MRL_Mother/MRL_Extensions/MRL_Financial_Core_v1/
            /MRL_Mother/09_workflow/tool_registry.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r MRL_Mother/MRL_Extensions/MRL_Financial_Core_v1/requirements.txt
      - run: python -m unittest MRL_Mother.MRL_Extensions.MRL_Financial_Core_v1.test_core -v
