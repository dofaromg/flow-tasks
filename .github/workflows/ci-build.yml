name: CI - Build MrLiou App Container Images

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/**'
      - 'particle_core/**'
      - 'flow_code/**'
      - 'pages/**'
      - 'lib/**'
      - 'package.json'
      - 'next.config.mjs'
      - '.github/workflows/ci-build.yml'
  workflow_dispatch:

env:
  PROJECT_ID: mrliou
  REGISTRY: localhost:5000

jobs:
  build-and-push:
    if: false
    runs-on: self-hosted

    permissions:
      contents: read

    strategy:
      matrix:
        service:
          - name: mrliou-module-a
            context: ./apps/module-a
            dockerfile: ./apps/module-a/Dockerfile
          - name: mrliou-orchestrator
            context: ./apps/orchestrator
            dockerfile: ./apps/orchestrator/Dockerfile
          - name: mrliou-frontend
            context: .
            dockerfile: ./apps/nextjs-frontend/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.service.name }}:${{ github.sha }} \
          -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.service.name }}:latest \
          -f ${{ matrix.service.dockerfile }} \
          ${{ matrix.service.context }}

    - name: Push to local registry
      run: |
        docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.service.name }}:${{ github.sha }}
        docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.service.name }}:latest

    - name: Summary
      run: |
        echo "### MrLiou App Image Built" >> $GITHUB_STEP_SUMMARY
        echo "**Service:** ${{ matrix.service.name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.service.name }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- \`${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.service.name }}:latest\`" >> $GITHUB_STEP_SUMMARY
