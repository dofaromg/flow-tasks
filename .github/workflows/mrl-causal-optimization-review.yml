name: MRL Causal Optimization Review

on:
  pull_request:
    paths:
      - "MRL_Governance/MRL_Causal_Optimization_Review_v1/**"
      - ".github/workflows/mrl-causal-optimization-review.yml"
  push:
    branches: [main]
    paths:
      - "MRL_Governance/MRL_Causal_Optimization_Review_v1/**"
      - ".github/workflows/mrl-causal-optimization-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate existing Mother preflight
        run: >-
          python
          MRL_Governance/MRL_Causal_Optimization_Review_v1/scripts/MRL_validate_existing_mother_preflight_v1.py
          MRL_Governance/MRL_Causal_Optimization_Review_v1/MRL_Existing_Mother_Preflight_v1.json
      - name: Run anti-rebuild preflight tests
        run: >-
          python -m unittest
          MRL_Governance/MRL_Causal_Optimization_Review_v1/tests/test_MRL_existing_mother_preflight_v1.py
          -v
      - name: Validate causal review example
        run: >-
          python
          MRL_Governance/MRL_Causal_Optimization_Review_v1/scripts/MRL_validate_causal_review_v1.py
          MRL_Governance/MRL_Causal_Optimization_Review_v1/examples/MRL_Causal_Review_Record_example.json
      - name: Validate conversation-window error audit
        run: >-
          python
          MRL_Governance/MRL_Causal_Optimization_Review_v1/scripts/MRL_validate_conversation_error_audit_v1.py
          MRL_Governance/MRL_Causal_Optimization_Review_v1/MRL_Conversation_Error_Gates_v1.json
          MRL_Governance/MRL_Causal_Optimization_Review_v1/examples/MRL_Conversation_Window_Error_Audit_20260913_v1.json
      - name: Run conversation error regression tests
        run: >-
          python -m unittest
          MRL_Governance/MRL_Causal_Optimization_Review_v1/tests/test_MRL_conversation_error_audit_v1.py
          -v
      - name: Run attestation aggregation tests
        run: >-
          python -m unittest
          MRL_Governance/MRL_Causal_Optimization_Review_v1/tests/test_MRL_aggregate_attestations_v1.py
          -v
