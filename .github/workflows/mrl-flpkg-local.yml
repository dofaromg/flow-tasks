name: MRL FLPKG local deployment
on:
  pull_request:
    paths:
      - 'MRL_FLPKG_Local_v1/**'
      - 'particle_core/src/logic_pipeline.py'
      - 'particle_core/src/pipeline_constants.py'
      - '.github/workflows/mrl-flpkg-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /MRL_FLPKG_Local_v1/
            /particle_core/src/logic_pipeline.py
            /particle_core/src/pipeline_constants.py
            /下載重建器腳本MRLiou_FLPKG_Rebuilder.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - working-directory: MRL_FLPKG_Local_v1
        run: python -X utf8 audit_delivery.py build ../MRL_FLPKG_Local_v1.zip
      - run: python -X utf8 -m zipfile -e MRL_FLPKG_Local_v1.zip deployed
      - working-directory: deployed
        run: python -X utf8 -m unittest -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MRL_FLPKG_Local_v1
          path: MRL_FLPKG_Local_v1.zip
          if-no-files-found: error
  windows-acceptance:
    runs-on: windows-latest
    needs: linux-build
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: MRL_FLPKG_Local_v1
      - run: python -X utf8 -m zipfile -e MRL_FLPKG_Local_v1.zip deployed
      - working-directory: deployed
        run: python -X utf8 audit_delivery.py verify ../MRL_FLPKG_Local_v1.zip
      - working-directory: deployed
        run: python -X utf8 -m unittest -v
