name: MRL FLPKG local deployment
on:
  pull_request:
    paths:
      - 'MRL_FLPKG_Local_v1/**'
      - 'particle_core/src/logic_pipeline.py'
      - 'particle_core/src/pipeline_constants.py'
      - '.github/workflows/mrl-flpkg-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - run: git config core.autocrlf false
      - working-directory: MRL_FLPKG_Local_v1
        run: python -X utf8 -m unittest -v
      - working-directory: MRL_FLPKG_Local_v1
        run: python -X utf8 audit_delivery.py build ../MRL_FLPKG_Local_v1.zip
