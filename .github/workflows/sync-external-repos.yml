name: Sync External Repositories
# MrLiouWord — maintain existing sources; preserve main and repository history.

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: '要同步的倉庫名稱 (留空則同步所有) / Repository name (empty for all)'
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 1'
  push:
    branches: [main]
    paths:
      - 'repos_sync.yaml'
      - '.github/workflows/sync-external-repos.yml'
      - 'scripts/sync_external_repos.py'
      - 'scripts/mrliou_publish_sync.sh'
  pull_request:
    paths:
      - '.github/workflows/sync-external-repos.yml'
      - 'scripts/sync_external_repos.py'
      - 'scripts/mrliou_publish_sync.sh'
      - 'tests/test_mrliou_sync.py'

permissions:
  contents: read

concurrency:
  group: Mrliou_MRL-external-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyyaml pytest
      - run: python -m pytest -q -o addopts='' tests/test_mrliou_sync.py
      - run: bash -n scripts/mrliou_publish_sync.sh

  sync:
    name: Sync Files from External Repositories
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      MRL_SYNC_ARTIFACT_DIR: ${{ runner.temp }}/Mrliou_MRL_sync
      MRL_SYNC_REPORT: ${{ runner.temp }}/Mrliou_MRL_sync/receipt.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pyyaml
      - name: Require clean starting tree
        run: test -z "$(git status --porcelain)"
      - name: Run synchronization
        id: sync
        env:
          SYNC_REPO: ${{ inputs.repo_name }}
        run: |
          args=(--report "$MRL_SYNC_REPORT")
          if [[ -n "$SYNC_REPO" ]]; then args+=(--repo "$SYNC_REPO"); fi
          python scripts/sync_external_repos.py "${args[@]}"
      - name: Preserve candidate and open review PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/mrliou_publish_sync.sh
      - name: Preserve source receipt and recoverable candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mrliou_MRL-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MRL_SYNC_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 90
      - name: Create summary
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          DELIVERY_STATE: ${{ steps.publish.outputs.state }}
        run: |
          {
            echo '## MRL synchronization — engineering transport'
            echo "Synchronization: $SYNC_OUTCOME"
            echo "Candidate publication: $PUBLISH_OUTCOME"
            echo "Delivery state: ${DELIVERY_STATE:-not_delivered}"
            echo 'Main unchanged. No automatic merge, product release, or rights transfer.'
            echo 'Preserved conflicts and incomplete sync are detailed in the receipt.'
          } >> "$GITHUB_STEP_SUMMARY"
