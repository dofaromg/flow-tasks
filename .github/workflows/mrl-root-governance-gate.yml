name: MRL Root Governance Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trusted-governance:
    name: trusted-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch proposed Git object without executing it
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Validate proposed change from trusted validator
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_mrl_governance.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate main
        if: github.event_name == 'push'
        run: python scripts/validate_mrl_governance.py --ref HEAD
