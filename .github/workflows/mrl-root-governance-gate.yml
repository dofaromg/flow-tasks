name: MRL Root Governance Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [mrl-governance-verify]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  trusted-governance:
    name: trusted-governance
    runs-on: ubuntu-latest
    steps:
      # 驗證器一律取自當前受保護的預設分支（main），不取自 PR 的 base.sha。
      # 歷史舊 PR 的 base.sha 可能早於治理腳本存在，會導致「腳本不在」的假失敗；
      # 從 main checkout 確保 validate_mrl_governance.py 永遠存在且可信。
      - name: Checkout trusted validator from protected default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # base/head 只作為資料輸入抓進來供 diff，永不 checkout、永不執行其程式碼。
      - name: Fetch proposed base and head as inert data (never executed)
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "$HEAD_SHA"
      - name: Validate proposed change with trusted validator
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_mrl_governance.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate current main/default ref
        if: github.event_name != 'pull_request_target'
        run: python scripts/validate_mrl_governance.py --ref HEAD
