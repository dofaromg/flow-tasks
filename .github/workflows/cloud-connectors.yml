name: Cloud connector audit

on:
  workflow_dispatch:
    inputs:
      sync:
        description: Synchronize enabled connectors after checking them
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # --include-disabled intentionally audits all eight declared services.
      - name: Verify all declared cloud connectors
        env:
          GITHUB_TOKEN: ${{ secrets.CLOUD_GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          credentials=(GITHUB_TOKEN NOTION_TOKEN DROPBOX_TOKEN GOOGLE_DRIVE_TOKEN VERCEL_TOKEN ICLOUD_USERNAME ICLOUD_APP_PASSWORD GITLAB_TOKEN HUGGINGFACE_TOKEN)
          for variable in "${credentials[@]}"; do
            secret_name="$variable"
            if [ "$variable" = GITHUB_TOKEN ]; then secret_name=CLOUD_GITHUB_TOKEN; fi
            if [ -z "${!variable:-}" ]; then
              echo "::error::Missing Actions secret $secret_name (environment variable $variable); check its name and repository/organization scope."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Cloud connector configuration is incomplete; no connector authentication was attempted. This job does not select a GitHub Environment."
            exit 1
          fi
          python -m connectors.connector_manager --connect-all --include-disabled --strict --json
      - name: Synchronize enabled cloud connectors
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync }}
        env:
          GITHUB_TOKEN: ${{ secrets.CLOUD_GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DROPBOX_TOKEN: ${{ secrets.DROPBOX_TOKEN }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ICLOUD_USERNAME: ${{ secrets.ICLOUD_USERNAME }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: python -m connectors.connector_manager --sync-all --strict --json
